[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dasIT"
version = "2.0.1"
description = "plane-wave delay-and-sum beamformer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Christoph Leitner", email = "christoph.leitner@tugraz.at" }]
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ModularUS/dasIT"

[tool.setuptools.packages.find]
include = ["dasIT*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
